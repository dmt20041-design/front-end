<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Course Registration</title>
<link rel="stylesheet" href="css/style.css">
<style>
.dashboard{width:100%;min-height:100vh;background:#f1f5f9}
.navbar{height:70px;background:white;padding:0 40px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.navbar-logo{font-size:20px;font-weight:700;color:#4f46e5}
.logout-button{border:none;background:#ef4444;color:white;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.logout-button:hover{background:#dc2626}
.content{max-width:1200px;margin:auto;padding:40px 20px}
.welcome{margin-bottom:30px}.welcome h1{color:#1e293b;margin-bottom:8px}.welcome p{color:#64748b}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:white;border-radius:15px;padding:25px;box-shadow:0 4px 15px rgba(0,0,0,.06)}
.card-icon{font-size:30px;margin-bottom:15px}.card h3{color:#334155;margin-bottom:8px}.card p{color:#64748b;font-size:14px}
.token-box{margin-top:30px;background:white;border-radius:15px;padding:25px}.token-box h3{margin-bottom:15px;color:#334155}
#tokenStatus{padding:15px;border-radius:8px;background:#f1f5f9;font-size:13px;word-break:break-all;color:#475569}
@media(max-width:768px){.navbar{padding:0 20px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="dashboard">
<nav class="navbar">
  <div class="navbar-logo">🎓 Course Registration</div>
  <button id="logoutButton" class="logout-button">Đăng xuất</button>
</nav>
<main class="content">
  <div class="welcome">
    <h1>Chào mừng bạn! 👋</h1>
    <p>Bạn đã đăng nhập thành công vào hệ thống.</p>
  </div>
  <div class="cards">
    <div class="card"><div class="card-icon">📚</div><h3>Đăng ký môn học</h3><p>Quản lý và đăng ký các môn học trong học kỳ.</p></div>
    <div class="card"><div class="card-icon">👨‍🎓</div><h3>Sinh viên</h3><p>Xem và quản lý thông tin sinh viên.</p></div>
    <div class="card"><div class="card-icon">🗓️</div><h3>Kỳ đăng ký</h3><p>Theo dõi thời gian đăng ký môn học.</p></div>
  </div>
  <div class="token-box">
    <h3>Trạng thái đăng nhập</h3>
    <div id="tokenStatus">Đang kiểm tra...</div>
  </div>
</main>
</div>
<script>
const accessToken=localStorage.getItem("accessToken");
if(!accessToken){window.location.href="index.html";}
else{document.getElementById("tokenStatus").textContent="✓ Đã đăng nhập. Access Token đã được lưu.";}
document.getElementById("logoutButton").addEventListener("click",function(){
  localStorage.removeItem("accessToken");
  localStorage.removeItem("refreshToken");
  localStorage.removeItem("tokenType");
  window.location.href="index.html";
});
</script>
</body>
</html>
